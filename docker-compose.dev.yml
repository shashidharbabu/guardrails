# Local development compose — NOT for production.
# Production uses Kubernetes/cloud-managed services.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardrails
      POSTGRES_PASSWORD: guardrails_dev
      POSTGRES_DB: guardrails
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrails"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://guardrails:guardrails_dev@postgres:5432/guardrails
      REDIS_URL: redis://redis:6379/0
      GATEWAY_URL: http://gateway:8080
      LLM_PROVIDER_URL: http://host.docker.internal:11434
      BASELINE_BASE_URL: http://host.docker.internal:11434/v1
      DECOMPOSER_BASE_URL: http://host.docker.internal:11434/v1
      MAD_DB_PATH: /tmp/mad_v4.db
      RAG_V2_REMOTE_URL: http://rag-service:8010
      DISABLE_AUTH: "true"
      LOG_LEVEL: DEBUG
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    environment:
      VITE_APP_ENV: development
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy

  rag-service:
    build:
      context: .
      dockerfile: rag_v2/Dockerfile
    env_file:
      - .env
    ports:
      - "8010:8010"
    environment:
      RAG_V2_BASE_DIR: /app/rag_v2
      RAG_V2_QDRANT_PATH: /app/rag_v2/indexes_qdrant_data
      RAG_V2_BM25_PATH: /app/rag_v2/bm25_combined.pkl
      RAG_V2_OLD_CHUNKS_PATH: /app/rag_v2/data/enriched_chunks.json
      RAG_V2_HC_CHUNKS_PATH: /app/rag_v2/data/healthcare_enriched_chunks.jsonl
      RAG_V2_DENSE_DEVICE: cpu
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  mad:
    build:
      context: .
      dockerfile: multi_agent_debate/full_FinalMAD_with_judge/Dockerfile
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      VLLM_BASELINE_URL: http://host.docker.internal:11434/v1
      VLLM_DECOMPOSER_URL: http://host.docker.internal:11434/v1
      VLLM_AGENTS_URL: http://host.docker.internal:11434/v1
      VLLM_JUDGE_URL: http://host.docker.internal:11434/v1
      AGENTS_MODEL_NAME: qwen2.5:7b
      AGENT_A_MODEL_NAME: qwen2.5:7b
      AGENT_B_MODEL_NAME: qwen2.5:7b
      JUDGE_MODEL_NAME: qwen2.5:7b
      SQLITE_DB_PATH: /app/data/mad.db
      CLAIM_CONCURRENCY: "2"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      LANGCHAIN_CACHE_DB: ""
    volumes:
      - mad_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/mad/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HF_TOKEN: ${HF_TOKEN}
      PII_MODEL_PATH: ${PII_MODEL_PATH:-iiiorg/piiranha-v1-detect-personal-information}
      THREAT_MODEL_PATH: ${THREAT_MODEL_PATH:-jackhhao/jailbreak-classifier}
      PROMPT_INJECTION_MODEL_PATH: ${PROMPT_INJECTION_MODEL_PATH:-protectai/deberta-v3-base-prompt-injection-v2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JUDGE_BACKEND: ${JUDGE_BACKEND:-claude}
    volumes:
      - ./gateway:/app/gateway

volumes:
  pg_data:
  mad_data:
