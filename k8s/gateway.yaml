apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 829108230080.dkr.ecr.us-west-2.amazonaws.com/guardrails/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: guardrails-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: guardrails
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
