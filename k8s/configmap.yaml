apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-config
  namespace: guardrails
data:
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  DEPLOYMENT_REGION: "us-west-2"
  LOG_LEVEL: "INFO"
  ENABLE_AUDIT_LOGGING: "true"
  DISABLE_AUTH: "false"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"

  # Service discovery (internal cluster DNS)
  GATEWAY_URL: "http://gateway:8080"
  MAD_API_URL: "http://mad-api:8001/mad/verify"
  FEEDBACK_API_URL: "http://rlhf:8002"
  REDIS_URL: "redis://redis:6379/0"

  # MAD config
  MAD_MODE: "api"
  MAD_TIMEOUT_SECONDS: "600"

  # LLM — decoupled from service, uses Anthropic API
  LLM_PROVIDER_TYPE: "claude"
  JUDGE_BACKEND: "claude"
  CLAUDE_JUDGE_MODEL: "claude-haiku-4-5-20251001"
  CLAUDE_JUDGE_TIMEOUT: "60"

  # Qdrant Cloud (GCP us-east4)
  QDRANT_URL: "https://e2e7b7d2-4927-4c61-a78d-61f9c4e024bb.us-east4-0.gcp.cloud.qdrant.io"
  QDRANT_COLLECTION: "ai_governance_chunks_nemotron8b"

  # CSE thresholds
  CSE_DELIVER_THRESHOLD: "0.75"
  CSE_HUMAN_REVIEW_THRESHOLD: "0.45"
  CSE_MAX_RETRY_COUNT: "1"

  # RLHF
  FEEDBACK_TRIAGE_LOW: "-0.10"
  FEEDBACK_TRIAGE_HIGH: "0.30"
  FEEDBACK_USE_PRESIDIO: "0"
