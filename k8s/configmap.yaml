apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-config
  namespace: guardrails
data:
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  DEPLOYMENT_REGION: "us-west-2"
  LOG_LEVEL: "INFO"
  ENABLE_AUDIT_LOGGING: "true"
  DISABLE_AUTH: "false"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"

  # Service discovery (internal cluster DNS)
  GATEWAY_URL: "http://gateway:8080"
  MAD_API_URL: "http://mad-api:8001/mad/verify"
  FEEDBACK_API_URL: "http://rlhf:8002"
  REDIS_URL: "redis://redis:6379/0"

  # MAD config
  MAD_MODE: "api"
  MAD_TIMEOUT_SECONDS: "600"

  # LLM — spartanguard-agents (Qwen2.5-14B-Instruct 4-bit AWQ + LoRA adapters)
  # Shared endpoint: used as main LLM (base model) AND MAD debate agents (with LoRA)
  LLM_PROVIDER_TYPE: "sagemaker"
  DEFAULT_LLM_MODEL: "spartanguard-agents"
  LLM_SAGEMAKER_ENDPOINT: "spartanguard-agents"
  # MAD judge uses Claude for high-quality policy reasoning
  JUDGE_BACKEND: "claude"
  CLAUDE_JUDGE_MODEL: "claude-haiku-4-5-20251001"
  CLAUDE_JUDGE_TIMEOUT: "60"

  # Gateway — SageMaker endpoints for remote model inference (no local loading)
  # PII: Qwen2.5-7B-Instruct + vineeth453/qwen25-7b-pii-detection-lora (generative NER)
  PII_SAGEMAKER_ENDPOINT: "spartanguard-pii"
  PII_LORA_ADAPTER: "vineeth453/qwen25-7b-pii-detection-lora"
  # PI: protectai/deberta-v3-base-prompt-injection-v2 (classifier)
  PI_SAGEMAKER_ENDPOINT: "spartanguard-pi"
  PI_GENERATIVE_MODE: "false"
  # JB: use spartanguard-agents (Qwen2.5-14B) with JB system prompt
  JB_SAGEMAKER_ENDPOINT: "spartanguard-agents"
  JB_GENERATIVE_MODE: "true"
  JB_LORA_ADAPTER: "agent-a"
  AWS_REGION: "us-west-2"

  # MAD pipeline — agents use SageMaker proxy inside the pod (localhost:8080)
  VLLM_AGENTS_URL: "http://localhost:8080/v1"
  VLLM_DECOMPOSER_URL: "http://localhost:8080/v1"
  VLLM_BASELINE_URL: "http://localhost:8080/v1"
  CLAIM_CONCURRENCY: "1"
  # Use Qwen2.5-7B (spartanguard-pii, A10G 24GB) for MAD agents — fast (~3s/call)
  # spartanguard-agents (14B AWQ on T4) times out on long debate prompts
  AGENTS_SAGEMAKER_ENDPOINT: "spartanguard-pii"
  AGENTS_A_MODEL_NAME: "agent-a"
  AGENTS_B_MODEL_NAME: "agent-b"
  AGENTS_MODEL_NAME: "agent-a"
  DECOMPOSER_MODEL_NAME: "agent-a"
  BASELINE_MODEL_NAME: "agent-a"
  # MAD judge uses Anthropic OpenAI-compat endpoint
  JUDGE_MODEL_NAME: "claude-haiku-4-5-20251001"
  VLLM_JUDGE_URL: "https://api.anthropic.com/v1"

  # Qdrant Cloud (GCP us-east4)
  QDRANT_URL: "https://e2e7b7d2-4927-4c61-a78d-61f9c4e024bb.us-east4-0.gcp.cloud.qdrant.io"
  QDRANT_COLLECTION: "ai_governance_chunks_nemotron8b"

  # CSE thresholds
  CSE_DELIVER_THRESHOLD: "0.75"
  CSE_HUMAN_REVIEW_THRESHOLD: "0.45"
  CSE_MAX_RETRY_COUNT: "1"

  # RLHF
  FEEDBACK_TRIAGE_LOW: "-0.10"
  FEEDBACK_TRIAGE_HIGH: "0.30"
  FEEDBACK_USE_PRESIDIO: "0"
