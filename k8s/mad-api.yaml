apiVersion: apps/v1
kind: Deployment
metadata:
  name: mad-api
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mad-api
  template:
    metadata:
      labels:
        app: mad-api
    spec:
      containers:
        - name: mad-api
          image: 829108230080.dkr.ecr.us-west-2.amazonaws.com/guardrails/mad-api:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: guardrails-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: ANTHROPIC_API_KEY
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: QDRANT_API_KEY
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: ANTHROPIC_API_KEY
            - name: SQLITE_DB_PATH
              value: "/tmp/mad.db"
            - name: LANGCHAIN_CACHE_DB
              value: "/tmp/langchain_cache.db"
            - name: AWS_REGION
              value: "us-west-2"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "1500m"
          livenessProbe:
            httpGet:
              path: /mad/health
              port: 8001
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /mad/health
              port: 8001
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mad-api
  namespace: guardrails
spec:
  selector:
    app: mad-api
  ports:
    - port: 8001
      targetPort: 8001
