apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 829108230080.dkr.ecr.us-west-2.amazonaws.com/guardrails/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: guardrails-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: JWT_SECRET_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: ANTHROPIC_API_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: REDIS_URL
            - name: CORS_ALLOWED_ORIGINS
              value: "PLACEHOLDER_FRONTEND_URL"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: guardrails
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
