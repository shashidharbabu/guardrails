apiVersion: apps/v1
kind: Deployment
metadata:
  name: rlhf
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rlhf
  template:
    metadata:
      labels:
        app: rlhf
    spec:
      containers:
        - name: rlhf
          image: 829108230080.dkr.ecr.us-west-2.amazonaws.com/guardrails/rlhf:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: guardrails-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrails-secrets
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rlhf
  namespace: guardrails
spec:
  selector:
    app: rlhf
  ports:
    - port: 8002
      targetPort: 8002
