[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "guardrails-enterprise"
version = "0.2.0"
description = "Model-agnostic three-layer enterprise AI guardrail system: input gateway (PII/jailbreak/prompt-injection) + RAG evidence retrieval + MAD output verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SJSU CS298B Team 3" }
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Full stack (app backend + gateway + MAD)
full = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "guardrails-ai>=0.5",
  "transformers>=4.41",
  "torch>=2.3",
  "openai>=1.30",
  "aiosqlite>=0.20",
]
# Development / testing
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = [".", "rag_folder"]
include = ["guardrails_enterprise*", "rag*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
