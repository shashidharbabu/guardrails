[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# ──────────────────────────────────────────────────────────────────────────────
# Project metadata
# ──────────────────────────────────────────────────────────────────────────────
[project]
name = "guardrails-enterprise"
version = "0.2.0"
description = "Enterprise AI guardrails: input gateway, multi-agent debate output verification, confidence scoring, and RAG pipeline — all in one SDK."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "guardrails", "llm", "enterprise", "rag", "multi-agent",
    "confidence-scoring", "hallucination", "pii", "prompt-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# ── Core dependencies (always installed) ─────────────────────────────────────
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]

# Input guardrail — PII / jailbreak / prompt-injection validators
gateway = [
    "guardrails-ai>=0.5",
    "transformers>=4.40",
    "torch>=2.2",
    "spacy>=3.7",
]

# RAG pipeline — Qdrant retrieval + embedding model
rag = [
    "qdrant-client>=1.9",
    "transformers>=4.40",
    "torch>=2.2",
    "huggingface-hub>=0.23",
    "openai>=1.30",
]

# Confidence scoring with DeepEval LLM judge
eval = [
    "deepeval>=3.0",
]

# RLHF feedback loop service
rlhf = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

# MAD v4 — LangGraph + vLLM production pipeline
mad-v4 = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langfuse>=2.50",
    "tenacity>=8.0",
    "qdrant-client>=1.9",
    "openai>=1.40",
]

# Backend orchestrator service (self-hosting)
backend = [
    "fastapi>=0.131",
    "uvicorn[standard]>=0.41",
    "gunicorn>=22.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.18",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "anthropic>=0.40",
    "redis>=5.0",
]

# Everything — full library mode (no servers needed except Ollama)
all = [
    "guardrails-ai>=0.5",
    "transformers>=4.40",
    "torch>=2.2",
    "spacy>=3.7",
    "qdrant-client>=1.9",
    "huggingface-hub>=0.23",
    "deepeval>=3.0",
    "ragas>=0.1",
    "openai>=1.40",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langfuse>=2.50",
]

[project.urls]
Homepage   = "https://github.com/shashidharbabu/guardrails-enterprise"
Repository = "https://github.com/shashidharbabu/guardrails-enterprise"
Issues     = "https://github.com/shashidharbabu/guardrails-enterprise/issues"

# ──────────────────────────────────────────────────────────────────────────────
# Package discovery
# ──────────────────────────────────────────────────────────────────────────────
[tool.setuptools]
include-package-data = true
packages = [
    # ── Namespace package (public SDK surface) ────────────────────────────────
    "guardrails_enterprise",
    "guardrails_enterprise.gateway",
    "guardrails_enterprise.confidence",
    "guardrails_enterprise.mad",
    "guardrails_enterprise.mad_v4",
    "guardrails_enterprise.rlhf",
    "guardrails_enterprise.backend",

    # ── Input guardrail ───────────────────────────────────────────────────────
    "gateway",
    "gateway.validators",

    # ── Confidence Scoring Engine ─────────────────────────────────────────────
    "confidence",

    # ── RLHF feedback loop ────────────────────────────────────────────────────
    "rlhf",
    "rlhf.feedback_loop",
    "rlhf.pipeline",

    # ── MAD legacy pipeline (flat alias: `from mad.X import Y`) ──────────────
    "mad",

    # ── MAD v4 production pipeline ────────────────────────────────────────────
    "mad_v4",
    "mad_v4.configs",
    "mad_v4.src",
    "mad_v4.src.agents",
    "mad_v4.src.db",
    "mad_v4.src.debate",
    "mad_v4.src.decomposer",
    "mad_v4.src.judge",
    "mad_v4.src.retrieval",
    "mad_v4.src.schemas",
    "mad_v4.src.utils",
    "mad_v4.src.langfuse_log",

    # ── Backend orchestrator (optional heavy service) ─────────────────────────
    "app",
    "app.backend",
    "app.backend.routers",
]

[tool.setuptools.package-dir]
# MAD legacy alias — `from mad.X import Y` maps to multi_agent_debate/multi_agent/
"mad"                       = "multi_agent_debate/multi_agent"
# MAD v4 — maps importable name to the full_FinalMAD_with_judge folder
"mad_v4"                    = "multi_agent_debate/full_FinalMAD_with_judge"
"mad_v4.configs"            = "multi_agent_debate/full_FinalMAD_with_judge/configs"
"mad_v4.src"                = "multi_agent_debate/full_FinalMAD_with_judge/src"
"mad_v4.src.agents"         = "multi_agent_debate/full_FinalMAD_with_judge/src/agents"
"mad_v4.src.db"             = "multi_agent_debate/full_FinalMAD_with_judge/src/db"
"mad_v4.src.debate"         = "multi_agent_debate/full_FinalMAD_with_judge/src/debate"
"mad_v4.src.decomposer"     = "multi_agent_debate/full_FinalMAD_with_judge/src/decomposer"
"mad_v4.src.judge"          = "multi_agent_debate/full_FinalMAD_with_judge/src/judge"
"mad_v4.src.retrieval"      = "multi_agent_debate/full_FinalMAD_with_judge/src/retrieval"
"mad_v4.src.schemas"        = "multi_agent_debate/full_FinalMAD_with_judge/src/schemas"
"mad_v4.src.utils"          = "multi_agent_debate/full_FinalMAD_with_judge/src/utils"
"mad_v4.src.langfuse_log"   = "multi_agent_debate/full_FinalMAD_with_judge/src/langfuse_log"

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "py.typed"]

# ──────────────────────────────────────────────────────────────────────────────
# Pytest configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests", "rlhf/tests", "confidence/tests", "gateway/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: live-service health probes — requires ./start.sh all (deselect with -m 'not smoke')",
]
